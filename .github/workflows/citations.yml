name: Update citations
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_citations.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - run: |
          git config user.name "citations-bot"
          git config user.email "actions@users.noreply.github.com"
          git add citations.json
          git diff --cached --quiet || git commit -m "Update citation counts"
          git push
